<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scratch Post micro app</title>
  </head>
  <body>
    <main class="desktop">
      <button id="desktop-shortcut" class="desktop-shortcut" type="button">
        <span class="shortcut-icon" aria-hidden="true"></span>
        Scratch Post
      </button>
      <div class="debug-controls" aria-label="Playground controls">
        <button id="add-billion-points" class="debug-shortcut" type="button">
          Add a billion points
        </button>
        <button id="subtract-all-points" class="debug-shortcut" type="button">
          Subtract all points
        </button>
        <button id="remove-top-auto-scratcher" class="debug-shortcut" type="button">
          Remove top auto scratcher
        </button>
      </div>

      <section id="app-window" class="window" aria-label="Scratch Post window">
        <header id="title-bar" class="title-bar">
          <strong><span class="title-icon" aria-hidden="true"></span> Scratch Post</strong>
          <span class="window-buttons">
            <button id="minimize" type="button" aria-label="Minimize Scratch Post">_</button>
            <button id="close" type="button" aria-label="Close Scratch Post">x</button>
          </span>
        </header>
        <div
          id="app-surface"
          class="window-body"
          role="img"
          aria-label="Scratch post: move your cursor or finger over it to scratch"
        >
          <canvas id="app-canvas" aria-hidden="true"></canvas>
        </div>
      </section>

      <footer class="taskbar">
        <button id="task-button" type="button">Scratch Post</button>
        <span id="status" role="status">starting</span>
      </footer>
    </main>
    <script type="module" src="/dev/main.ts"></script>
  </body>
</html>
